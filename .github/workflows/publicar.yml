# Publica FIT SPLIT en GitHub Pages cada vez que cambia la rama main.
# (Settings → Pages → Source: «GitHub Actions»).
name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar la web
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js robots.txt sitemap.xml .nojekyll css js assets _site/
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
